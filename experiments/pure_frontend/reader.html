<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart VIVID TTS</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-body: #f1f5f9;
      --bg-card: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 20px;
      background: var(--bg-body); color: var(--text-main);
      line-height: 1.5;
    }

    .app {
      max-width: 1100px; margin: 0 auto;
      background: var(--bg-card); border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem;
    }

    header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border); padding-bottom: 1rem;
    }
    
    h1 { margin: 0; font-size: 1.5rem; font-weight: 700; }
    #status { font-size: 0.875rem; color: var(--primary); background: #eef2ff; padding: 0.25rem 0.75rem; border-radius: 999px; }

    .toolbar-section { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; padding: 0.5rem 0; }
    .toolbar-group { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; background: #f8fafc; padding: 0.5rem; border-radius: var(--radius); border: 1px solid var(--border); }

    /* Custom "Choose PDF" button */
    #file-input {
      display: none;
    }

    .file-input-label {
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: white;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }

    .file-input-label:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    button {
      padding: 0.5rem 1rem; font-size: 0.9rem; font-weight: 500;
      border-radius: 6px; border: 1px solid var(--border);
      background: white; cursor: pointer; transition: all 0.2s;
    }
    button:hover:not(:disabled) { background: #f1f5f9; border-color: #cbd5e1; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    #read-page { background: var(--primary); color: white; border-color: transparent; }
    #read-page:hover:not(:disabled) { background: var(--primary-hover); }
    #stop-tts { color: var(--danger); border-color: #fca5a5; }

    select, input {
      padding: 0.45rem 0.75rem; border-radius: 6px;
      border: 1px solid var(--border); font-size: 0.9rem;
    }

    #minimax-panel {
      background: #f8fafc; border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1rem;
      display: none; animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(-5px); } to { opacity:1; transform:translateY(0); } }
    
    .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; align-items: end; }
    .setting-item { display: flex; flex-direction: column; gap: 0.35rem; }

    #pdf-container {
      position: relative; margin: 1rem auto 0; display: inline-block;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
      border-radius: 4px; overflow: hidden; line-height: 0;
    }
    #pdf-canvas { display: block; background: #fafafa; }
    
    /* --- Text Layer --- */
    #text-layer {
      position: absolute; left: 0; top: 0; right: 0; bottom: 0;
      overflow: hidden; line-height: 1.0;
      user-select: text; 
      -webkit-user-select: text;
    }

    .text-span {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text; 
      border-radius: 3px;
      line-height: 1;
      transform-origin: 0% 0%;
      box-sizing: border-box;
    }

    /* Highlight for the sentence currently being read */
    .text-span-reading {
      background: rgba(79, 70, 229, 0.15);
      box-shadow: 0 0 0 1px rgba(79, 70, 229, 0.3);
    }

    /* Hover: highlight whole sentence */
    .text-span-hover {
      background: rgba(79, 70, 229, 0.12);
      box-shadow: 0 0 0 1px rgba(79, 70, 229, 0.25);
    }

    ::selection { background: rgba(79, 70, 229, 0.3); }
    .text-span:hover { outline: 1px solid rgba(79, 70, 229, 0.3); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <div class="app">
    <header>
      <h1>VIVID <span style="color:var(--text-muted); font-weight:400;"> TTS</span></h1>
      <div id="status">Waiting for file...</div>
    </header>

    <div id="toolbar">
      <div class="toolbar-section">
        <div class="toolbar-group">
          <label for="file-input" class="file-input-label">Choose PDF</label>
          <input id="file-input" type="file" accept="application/pdf" />
        </div>
        <div class="toolbar-group">
            <button id="prev-page" disabled>◀</button>
            <span id="page-info" style="min-width:80px; text-align:center; font-weight:600;">-- / --</span>
            <button id="next-page" disabled>▶</button>
        </div>
      </div>
      <div class="toolbar-section">
        <button id="read-page" disabled>🔊 Read Page</button>
        <div class="toolbar-group">
            <button id="pause-tts" disabled>⏸ Pause</button>
            <button id="resume-tts" disabled>▶ Resume</button>
            <button id="stop-tts" disabled>⏹ Stop</button>
        </div>
      </div>
      <div style="height:1px; background:var(--border); width:100%;"></div>
      
      <div class="toolbar-section">
        <div class="toolbar-group">
            <label>TTS Engine:</label>
            <select id="tts-engine">
              <option value="browser">Browser (Free)</option>
              <option value="minimax">MiniMax (High Quality)</option>
            </select>
        </div>
        <div class="toolbar-group" id="browser-voice-group">
            <label>Voice:</label>
            <select id="browser-voice" style="max-width: 180px;"></select>
        </div>

        <!-- NEW: Mode Dropdown -->

        <div class="toolbar-group">
            <label>Speed: <span id="speed-val">1.0</span>x</label>
            <input id="global-speed" type="range" min="0.5" max="2" step="0.1" value="1" style="width:100px; cursor:pointer;" />
        </div>
      </div>

      <div id="minimax-panel">
        <div class="settings-grid">
            <div class="setting-item" style="grid-column: span 2;">
                <label>API Key</label>
                <input id="minimax-key" type="password" placeholder="Enter MiniMax Key" />
            </div>
            <div class="setting-item">
                <label>Voice</label>
                <select id="minimax-voice" style="width:100%"></select>
                <input id="minimax-voice-custom" type="text" placeholder="id" style="display:none; margin-top:5px;" />
            </div>
            </div>
      </div>
    </div>

    <div style="text-align: center; background: #e2e8f0; padding: 2rem; border-radius: 8px; overflow: auto;">
        <div id="pdf-container">
            <canvas id="pdf-canvas"></canvas>
            <div id="text-layer"></div>
        </div>
        <p style="margin-top:1rem; color:var(--text-muted); font-size:0.9rem;">💡 Tip: <b>Drag mouse</b> to read sentences, or <b>Click</b> to read single words or entire sentences (depending on mode).</p>
    </div>

    <audio id="player" hidden></audio>
  </div>

  <script>
    // --- PDF.js Setup ---
    const pdfjsLib = window['pdfjsLib'];
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // --- UI Elements ---
    const els = {
      file: document.getElementById('file-input'),
      canvas: document.getElementById('pdf-canvas'),
      textLayer: document.getElementById('text-layer'),
      status: document.getElementById('status'),
      pageInfo: document.getElementById('page-info'),
      audio: document.getElementById('player'),
      minimaxPanel: document.getElementById('minimax-panel'),
      engine: document.getElementById('tts-engine'),
      browserVoiceGroup: document.getElementById('browser-voice-group'),
      btns: {
        prev: document.getElementById('prev-page'),
        next: document.getElementById('next-page'),
        read: document.getElementById('read-page'),
        pause: document.getElementById('pause-tts'),
        resume: document.getElementById('resume-tts'),
        stop: document.getElementById('stop-tts')
      },
      settings: {
        key: document.getElementById('minimax-key'),
        voice: document.getElementById('minimax-voice'),
        customVoice: document.getElementById('minimax-voice-custom'),
        speed: document.getElementById('global-speed'),
        speedVal: document.getElementById('speed-val'),
        browserVoice: document.getElementById('browser-voice'),
        mode: document.getElementById('reading-mode')  // NEW
      }
    };

    const ctx = els.canvas.getContext('2d');
    let pdfDoc = null, currentPage = 1, scale = 1.5;
    let browserVoices = []; // Store available system voices

    // --- Globals for sentence-based reading ---
    let pageFullText = '';
    let pageSentences = [];
    let pageSentenceRanges = []; // { start, end }
    let pageItemMeta = [];       // { start, end, span }

    const continuousState = {
      active: false,
      sentenceIndex: 0,
      utterance: null
    };
    
    // --- Helpers ---
    function setStatus(msg) { els.status.textContent = msg; }

    function clearHighlights() {
      els.textLayer.querySelectorAll('.text-span-reading').forEach(el => {
        el.classList.remove('text-span-reading');
      });
    }

    function clearHoverHighlights() {
      els.textLayer.querySelectorAll('.text-span-hover').forEach(el => {
        el.classList.remove('text-span-hover');
      });
    }

    function stopContinuousMode() {
      continuousState.active = false;
      continuousState.utterance = null;
      clearHighlights();
    }
    
    function resetTTS() {
      window.speechSynthesis.cancel();
      els.audio.pause(); els.audio.currentTime = 0;
      els.btns.pause.disabled = true; els.btns.resume.disabled = true; els.btns.stop.disabled = true;
      stopContinuousMode();
    }

    // --- Browser TTS Logic ---
    
    // 1. Load Voices
    function loadBrowserVoices() {
      browserVoices = window.speechSynthesis.getVoices();
      els.settings.browserVoice.innerHTML = '';
      
      browserVoices.forEach((v, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = `${v.name} (${v.lang})`; 
        els.settings.browserVoice.appendChild(opt);
      });
    }
    
    window.speechSynthesis.onvoiceschanged = loadBrowserVoices;
    loadBrowserVoices();

    function speakBrowser(text) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      
      u.rate = parseFloat(els.settings.speed.value);
      
      const selectedIndex = els.settings.browserVoice.value;
      if (browserVoices[selectedIndex]) {
        u.voice = browserVoices[selectedIndex];
      }

      els.btns.pause.disabled = false; els.btns.stop.disabled = false;
      u.onend = () => { setStatus('Done'); els.btns.pause.disabled = true; els.btns.stop.disabled = true; };
      window.speechSynthesis.speak(u);
    }

    // --- MiniMax TTS ---
    const MINI_VOICES = [
      {id:'English_expressive_narrator',l:'English — Narrator'}, {id:'English_male_calm',l:'English — Calm'},
      {id:'Chinese (Mandarin)_Lyrical_Voice',l:'Chinese — Lyrical'}, {id:'__custom__',l:'Custom...'}
    ];
    
    async function speakMiniMax(text) {
      const key = els.settings.key.value.trim();
      const voice = els.settings.voice.value === '__custom__' ? els.settings.customVoice.value : els.settings.voice.value;
      const speed = parseFloat(els.settings.speed.value);
      
      if (!key) { alert('API Key missing'); return; }
      setStatus('Loading Audio...');
      
      try {
        const res = await fetch('https://api.minimax.io/v1/t2a_v2', {
          method:'POST', headers:{'Authorization':'Bearer '+key, 'Content-Type':'application/json'},
          body: JSON.stringify({
            model:'speech-2.6-hd', text: text, stream:false, output_format:'hex',
            voice_setting:{voice_id:voice, speed:speed}, audio_setting:{sample_rate:32000, format:'mp3'}
          })
        });
        const data = await res.json();
        if (data.base_resp?.status_code !== 0) throw new Error(data.base_resp?.status_msg || 'API Error');
        
        const buf = new Uint8Array(data.data.audio.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
        const blob = new Blob([buf], {type:'audio/mpeg'});
        
        resetTTS();
        els.audio.src = URL.createObjectURL(blob);
        els.audio.hidden = false;
        await els.audio.play();
        setStatus('Playing...');
        els.btns.pause.disabled = false; els.btns.stop.disabled = false;
      } catch(e) {
        console.error(e); setStatus('Error: ' + e.message);
      }
    }

    function speak(text) {
      if (!text) return;
      if (els.engine.value === 'minimax') speakMiniMax(text);
      else speakBrowser(text);
    }

    // --- Sentence utilities for continuous mode ---

    function buildSentenceRanges() {
      pageSentences = [];
      pageSentenceRanges = [];

      const text = pageFullText;
      if (!text) return;

      // Group by sentence terminators, include punctuation in range
      const regex = /[^.!?]+[.!?]+|\S+/g;
      let match;
      while ((match = regex.exec(text)) !== null) {
        const raw = match[0];
        if (!raw.trim()) continue;

        const start = match.index;
        let end = start + raw.length;

        // Trim trailing whitespace from the range
        while (end > start && /\s/.test(text[end - 1])) {
          end--;
        }

        const sentenceText = text.slice(start, end).trim();
        if (!sentenceText) continue;

        pageSentences.push(sentenceText);
        pageSentenceRanges.push({ start, end });
      }
    }

    function findSentenceIndexForChar(charIndex) {
      for (let i = 0; i < pageSentenceRanges.length; i++) {
        const r = pageSentenceRanges[i];
        if (charIndex >= r.start && charIndex < r.end) return i;
      }
      return -1;
    }

    function highlightSentence(sentenceIndex) {
      clearHighlights();
      const range = pageSentenceRanges[sentenceIndex];
      if (!range) return;

      pageItemMeta.forEach(meta => {
        if (!meta.span) return;
        // overlap check
        if (meta.end <= range.start || meta.start >= range.end) return;
        meta.span.classList.add('text-span-reading');
      });
    }

    function highlightSentenceHover(sentenceIndex) {
      clearHoverHighlights();
      const range = pageSentenceRanges[sentenceIndex];
      if (!range) return;

      pageItemMeta.forEach(meta => {
        if (!meta.span) return;
        if (meta.end <= range.start || meta.start >= range.end) return;
        meta.span.classList.add('text-span-hover');
      });
    }

    function playNextSentence() {
      if (!continuousState.active) return;

      const idx = continuousState.sentenceIndex;
      if (idx >= pageSentences.length) {
        stopContinuousMode();
        setStatus('Done');
        return;
      }

      const text = pageSentences[idx];
      if (!text) {
        continuousState.sentenceIndex++;
        playNextSentence();
        return;
      }

      highlightSentence(idx);

      const u = new SpeechSynthesisUtterance(text);
      continuousState.utterance = u;
      u.rate = parseFloat(els.settings.speed.value);

      const selectedIndex = els.settings.browserVoice.value;
      if (browserVoices[selectedIndex]) u.voice = browserVoices[selectedIndex];

      els.btns.pause.disabled = false;
      els.btns.stop.disabled = false;

      u.onend = () => {
        if (!continuousState.active) {
          clearHighlights();
          return;
        }
        continuousState.sentenceIndex++;
        setTimeout(playNextSentence, 40);
      };

      u.onerror = () => {
        stopContinuousMode();
        setStatus('Error during speech');
      };

      window.speechSynthesis.speak(u);
    }

    function startContinuousReadingFromSentence(startIndex) {
      if (els.engine.value !== 'browser') {
        alert('Sentence & Continue mode currently works with Browser TTS only.');
        return;
      }
      if (startIndex < 0 || startIndex >= pageSentences.length) {
        return;
      }
      resetTTS();
      continuousState.active = true;
      continuousState.sentenceIndex = startIndex;
      playNextSentence();
    }

    // --- Interaction Logic ---
    document.addEventListener('mouseup', () => {
      const selection = window.getSelection();
      const selectedText = selection.toString().trim();
      if (selectedText.length > 0 && els.textLayer.contains(selection.anchorNode)) {
        resetTTS(); speak(selectedText);
      }
    });

    function handleSpanClick(e, metaIndex) {
      const selection = window.getSelection();
      if (selection.toString().length === 0 && pageSentenceRanges.length > 0) {
        e.stopPropagation();
        resetTTS();

        const meta = pageItemMeta[metaIndex];
        if (!meta) return;

        const sentenceIndex = findSentenceIndexForChar(meta.start);
        if (sentenceIndex !== -1) {
          // Start reading from this sentence and continue to the end of the page
          startContinuousReadingFromSentence(sentenceIndex);
        }
      }
    }

    function handleSpanMouseEnter(e, metaIndex) {
      const meta = pageItemMeta[metaIndex];
      if (!meta) return;

      const sentenceIndex = findSentenceIndexForChar(meta.start);
      if (sentenceIndex !== -1) {
        highlightSentenceHover(sentenceIndex);
      }
    }

    function handleSpanMouseLeave(e, metaIndex) {
      clearHoverHighlights();
    }

    // --- Rendering ---
    function renderTextLayer(page, viewport) {
      els.textLayer.innerHTML = '';
      pageFullText = '';
      pageSentences = [];
      pageSentenceRanges = [];
      pageItemMeta = [];

      page.getTextContent().then(content => {
        content.items.forEach(item => {
          if (!item.str.trim()) return;

          const prefix = pageFullText.length === 0 ? '' : ' ';
          const start = pageFullText.length + prefix.length;
          pageFullText += prefix + item.str;
          const end = start + item.str.length;

          const s = document.createElement('span');
          s.textContent = item.str; 
          s.className = 'text-span';
          
          const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
          const h = Math.hypot(tx[2], tx[3]);
          
          s.style.left = tx[4] + 'px';
          s.style.top = (tx[5] - h * 0.9) + 'px';
          s.style.fontSize = h + 'px';
          if (item.width > 0) s.style.width = (item.width * viewport.scale) + 'px';
          
          const metaIndex = pageItemMeta.length;
          pageItemMeta.push({ start, end, span: s });

          s.addEventListener('mousedown', (ev) => ev.stopPropagation()); 
          s.addEventListener('click', (ev) => handleSpanClick(ev, metaIndex));
          s.addEventListener('mouseenter', (ev) => handleSpanMouseEnter(ev, metaIndex));
          s.addEventListener('mouseleave', (ev) => handleSpanMouseLeave(ev, metaIndex));
          els.textLayer.appendChild(s);
        });

        buildSentenceRanges();
      });
    }

    function renderPage(num) {
      pdfDoc.getPage(num).then(page => {
        const viewport = page.getViewport({ scale });
        els.canvas.height = viewport.height; els.canvas.width = viewport.width;
        els.textLayer.style.width = viewport.width+'px'; els.textLayer.style.height = viewport.height+'px';
        page.render({canvasContext:ctx, viewport}).promise.then(() => setStatus('Ready'));
        renderTextLayer(page, viewport);
        els.pageInfo.textContent = `${num} / ${pdfDoc.numPages}`;
        els.btns.prev.disabled = num<=1; els.btns.next.disabled = num>=pdfDoc.numPages;
        els.btns.read.disabled = false;
      });
    }

    async function getSpokenTranscript(rawText) {

        const systemPrompt = `
            You are a reading assistant for the visually impaired. 
            Your job is to convert raw text (which may contain LaTeX, math symbols, or messy PDF formatting) into a "spoken script" optimized for Text-to-Speech engines.
            
            Rules:
            1. Convert all math equations into natural spoken English.
               - Example: "n^2" becomes "n to the power of two" or "n squared".
               - Example: "f(x) = \\\\frac{1}{2}" becomes "f of x equals one half".
            2. Expand abbreviations (e.g., "Fig. 1" becomes "Figure one").
            3. Remove page numbers, headers, or footers if they appear in the middle of sentences.
            4. Do NOT reply with "Here is the text". Just output the spoken script.
        `;

        try {
            const response = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "gpt-4o-mini",
                    messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: rawText }
                    ],
                    temperature: 0.3
                })
            });

            const data = await response.json();
            
            if (!data.choices || data.choices.length === 0) {
                throw new Error("No response from OpenAI");
            }

            return data.choices[0].message.content;

        } catch (error) {
            console.error("Rewriting failed, falling back to raw text:", error);
            return rawText;
        }
    }

    // --- Event Listeners ---
    els.file.addEventListener('change', e => {
      const file = e.target.files[0];
      if(!file) return;
      const r = new FileReader();
      r.onload = (ev) => {
        const data = new Uint8Array(ev.target.result);
        pdfjsLib.getDocument(data).promise.then(pdf => {
          pdfDoc = pdf; currentPage = 1; renderPage(1);
        });
      };
      r.readAsArrayBuffer(file);
    });

    els.btns.prev.addEventListener('click', () => { if(currentPage>1) { resetTTS(); renderPage(--currentPage); } });
    els.btns.next.addEventListener('click', () => { if(currentPage<pdfDoc.numPages) { resetTTS(); renderPage(++currentPage); } });
    
    els.btns.read.addEventListener('click', () => {
      pdfDoc.getPage(currentPage)
        .then(p => p.getTextContent())
        .then(async c => {
            const text = c.items.map(i => i.str).join(' ');
            resetTTS();
            const gptText = await getSpokenTranscript(text);
            speak(gptText);
        })
        .catch(err => console.error("Error in reading process:", err));
    });

    els.btns.pause.addEventListener('click', () => {
       if(els.engine.value==='minimax') { els.audio.pause(); setStatus('Paused'); }
       else window.speechSynthesis.pause();
       els.btns.pause.disabled=true; els.btns.resume.disabled=false;
    });
    
    els.btns.resume.addEventListener('click', () => {
       if(els.engine.value==='minimax') { els.audio.play(); setStatus('Playing'); }
       else window.speechSynthesis.resume();
       els.btns.pause.disabled=false; els.btns.resume.disabled=true;
    });

    els.btns.stop.addEventListener('click', resetTTS);

    // Engine Change: Toggle visibility of Voice Selectors
    els.engine.addEventListener('change', () => {
      const isMini = els.engine.value === 'minimax';
      els.minimaxPanel.style.display = isMini ? 'block' : 'none';
      els.browserVoiceGroup.style.display = isMini ? 'none' : 'flex';
      // If we were in continuous mode, stop it when engine switches
      if (isMini) stopContinuousMode();
    });
    
    els.settings.voice.addEventListener('change', () => {
       els.settings.customVoice.style.display = els.settings.voice.value==='__custom__'?'block':'none';
    });
    
    els.settings.speed.addEventListener('input', () => els.settings.speedVal.textContent = els.settings.speed.value);

    MINI_VOICES.forEach(v => {
      const o = document.createElement('option'); o.value=v.id; o.textContent=v.l; els.settings.voice.appendChild(o);
    });
  </script>
</body>
</html>
